<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lootboxes incremental</title>
  <link rel="stylesheet" href="styles/index.css">
  <script type="importmap">
    {
      "imports": {
        "animejs": "./node_modules/animejs/dist/modules/index.js"
      }
    }
  </script>
</head>
<body>
  <div class="topbar">
    <span class="cash-label" id="cash-label">Cash: 0</span>
  </div>

  <div class="above" id="above">
    <div class="top-half">
      <div class="left-side">
        <div class="row">
          <div class="counter" id="boxes-counter">0</div>
          <button class="make-box" id="make-box">Make box</button>
          <div class="counter"></div>
        </div>

        <div class="boxes-container" id="boxes-container"></div>
        <div class="row">
          <div class="box-place" id="box-place"></div>  
        </div>
        <div class="row">
         <button id="pack-box" disabled="true">Pack box</button>
        </div>
      </div>

      <div class="right-side">
        <div class="row">
           <div class="counter" id="loot-counter">0</div>
           <button id="make-loot">Make loot</button>
           <div class="counter"></div>
        </div>
        <div class="row">
          <div class="loot-container" id="loot-container"></div>
        </div>
      </div>
    </div>
    
    <div class="bottom-half">
      <div>drop off area</div>
      <div class="dropoff-area" id="dropoff-area"></div>
    </div>
  </div>

  <div class="below" id="below">
    
  </div>
  
  <script src="./scripts/index.js" type="module"></script>
</body>
</html>
